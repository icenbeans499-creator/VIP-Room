<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VIP Room · Ice N Beans</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Tajawal:wght@400;500;700&display=swap" media="print" onload="this.media=\'all\'">
<style>
:root{--ink:#171412;--ink2:#221e1a;--line:#3a332b;--beige:#d8c3a0;--cream:#f1e8d6;--mute:#9b8f7c;--busy:#d9644a;--soon:#e0b04f;--free:#8fbf8a;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html{background:var(--ink)}
body{font-family:Tajawal,Tahoma,sans-serif;background:var(--ink);color:var(--cream);min-height:100vh;padding:18px;max-width:1100px;margin:auto;line-height:1.6}
h1,h2,.disp{font-family:'Reem Kufi',Tajawal,sans-serif;font-weight:700}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:26px;color:var(--beige)}
.brand span{color:var(--mute);font-size:15px}
.tools{display:flex;gap:14px;align-items:center;color:var(--mute);font-size:14px}
.tools input{width:70px;text-align:center}
#clock{font-family:'Reem Kufi';font-size:20px;color:var(--cream)}
input,button,select{font:inherit;color:inherit}
input,select{background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--cream);min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.chip{padding:5px 12px;font-size:13px;background:var(--ink);border:1px solid var(--line);color:var(--beige);border-radius:999px}
dialog input,dialog select{width:100%;margin-top:8px}
input:focus-visible,button:focus-visible{outline:2px solid var(--beige);outline-offset:2px}
button{cursor:pointer;border:0;border-radius:12px;padding:11px 18px;font-weight:700;background:var(--line);transition:transform .1s}
button:active{transform:scale(.97)}
.primary{background:var(--beige);color:var(--ink)}
.danger{background:var(--busy);color:#1a0d09}
.ghost{background:transparent;border:1px solid var(--line);color:var(--beige)}
.grid{display:grid;grid-template-columns:1.35fr 1fr;gap:16px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.panel{background:var(--ink2);border:1px solid var(--line);border-radius:22px;padding:22px}
.hero{display:flex;flex-direction:column;gap:14px;min-height:380px;border-color:var(--line);position:relative}
.hero[data-s=busy]{border-color:var(--busy)}
.hero[data-s=soon]{border-color:var(--soon)}
.state{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700}
.dot{width:12px;height:12px;border-radius:50%;background:var(--free)}
[data-s=busy] .dot{background:var(--busy);animation:p 1.6s infinite}
[data-s=soon] .dot{background:var(--soon)}
@keyframes p{50%{box-shadow:0 0 0 8px transparent;opacity:.5}0%{box-shadow:0 0 0 0 rgba(217,100,74,.5)}}
@media(prefers-reduced-motion:reduce){.dot{animation:none!important}}
.spec{color:var(--mute);font-size:14px}
.timer{font-family:'Reem Kufi';font-size:clamp(56px,12vw,96px);line-height:1;letter-spacing:2px;color:var(--cream);direction:ltr;text-align:center;margin:10px 0 2px;font-variant-numeric:tabular-nums}
.free-big{font-family:'Reem Kufi';font-size:clamp(40px,9vw,64px);text-align:center;color:var(--beige);margin:22px 0 6px}
.amt{text-align:center;font-size:20px;color:var(--beige)}
.note{background:#2c2417;border:1px solid var(--soon);color:var(--soon);border-radius:12px;padding:10px 14px;font-size:15px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:auto}
.row>input{flex:1;min-width:140px}
.row>button{flex:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--ink);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-family:'Reem Kufi';font-size:24px;color:var(--beige)}
.stat small{color:var(--mute)}
h2{font-size:19px;margin-bottom:12px;color:var(--beige)}
form.bk{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
form.bk .w{grid-column:1/-1}
form.bk label{font-size:13px;color:var(--mute);display:flex;flex-direction:column;gap:3px}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.item small{color:var(--mute);display:block}
.item .acts{display:flex;gap:6px}
.item .acts button{padding:7px 12px;font-size:14px}
.empty{color:var(--mute);padding:10px 0;font-size:15px}
.log{margin-top:16px}
.amount{font-family:'Reem Kufi';color:var(--beige);white-space:nowrap}
dialog{border:1px solid var(--beige);border-radius:22px;background:var(--ink2);color:var(--cream);padding:26px;width:min(92vw,380px);margin:auto}
dialog::backdrop{background:rgba(0,0,0,.7)}
dialog .big{font-family:'Reem Kufi';font-size:52px;color:var(--beige);text-align:center;margin:8px 0}
dialog p{text-align:center;color:var(--mute)}
dialog .row{margin-top:18px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--beige);color:var(--ink);padding:10px 20px;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.on{opacity:1}
#sndBar button{font-size:16px}
#bill{max-height:90vh;overflow:auto}.rc{margin:14px 0;text-align:right}.rh{color:var(--beige);font-weight:700;border-bottom:1px solid var(--line);margin-top:12px;padding-bottom:3px}.rl{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:15px}.rs{color:var(--mute)}
.amount small,small.amount{display:block}
</style>
</head>
<body>
<header>
  <div class="brand"><h1>Ice N Beans</h1><span>VIP Room</span></div>
  <div class="tools">
    <label>سعر الساعة <input id="rate" type="number" min="0" step="5" inputmode="numeric"> ج</label>
    <button class="ghost" id="pkgBtn" type="button">الباقات</button>
    <span id="clock"></span>
  </div>
</header>

<section class="panel" id="ordersPanel" style="margin-bottom:16px">
  <h2>طلبات الروم</h2>
  <div id="sndBar"></div>
  <div id="orders"></div>
</section>
<div class="grid">
  <section class="panel hero" id="hero"></section>
  <aside class="panel">
    <div class="stats" id="stats"></div>
    <h2>الحجوزات</h2>
    <form class="bk" id="bkForm">
      <label class="w">اسم الحاجز<input id="bName" required placeholder="الاسم"></label>
      <label>التاريخ<input id="bDate" type="date" required></label>
      <label>الساعة<input id="bTime" type="time" required></label>
      <label>المدة (ساعات)<input id="bHours" type="number" min="0.5" max="12" step="0.5" value="1" required></label>
      <label>موبايل<input id="bPhone" type="tel" inputmode="tel" placeholder="اختياري"></label>
      <button class="primary w" type="submit">احجز</button>
    </form>
    <div id="bookings"></div>
  </aside>
</div>

<section class="panel log">
  <h2>سجل النهارده</h2>
  <div id="log"></div>
</section>

<dialog id="bill">
  <h2 style="text-align:center">الحساب</h2>
  <div class="big" id="billAmt"></div>
  <div id="billInfo"></div>
  <div class="row">
    <button class="ghost" id="billPrint" type="button">طباعة</button><button class="ghost" id="billBack" type="button">كمّل لعب</button>
    <button class="primary" id="billOk" type="button">تم الدفع</button>
  </div>
</dialog>
<dialog id="itemDlg"><h2 style="text-align:center">طلب على الجلسة</h2><input id="iName" placeholder="الطلب (مثلا قهوة)"><input id="iPrice" type="number" min="0" inputmode="decimal" placeholder="السعر بالجنيه"><div class="row"><button class="ghost" id="itemNo" type="button">إلغاء</button><button class="primary" id="itemOk" type="button">أضف</button></div></dialog>
<dialog id="discDlg"><h2 style="text-align:center">خصم على الجلسة</h2><input id="dVal" type="number" min="0" inputmode="decimal" placeholder="قيمة الخصم"><select id="dType"><option value="ج">جنيه</option><option value="%">نسبة %</option></select><div class="row"><button class="ghost" id="discNo" type="button">إلغاء</button><button class="primary" id="discOk" type="button">تطبيق</button></div></dialog>
<dialog id="pkgDlg"><h2 style="text-align:center">الباقات</h2><div id="pkgList"></div><input id="pH" type="number" min="0.5" step="0.5" inputmode="decimal" placeholder="عدد الساعات"><input id="pP" type="number" min="0" inputmode="decimal" placeholder="سعر الباقة بالجنيه"><div class="row"><button class="ghost" id="pkgClose" type="button">قفل</button><button class="primary" id="pkgAdd" type="button">أضف باقة</button></div></dialog>
<div class="toast" id="toast"></div>

<script>
var KEY='inb_vip_room';
var S={rate:100,session:null,bookings:[],log:[],packages:[]};
try{var raw=localStorage.getItem(KEY);if(raw)Object.assign(S,JSON.parse(raw));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
var $=function(s){return document.querySelector(s)};
var p2=function(n){return String(n).padStart(2,'0')};
function ymd(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function hm(t){var d=new Date(t);return p2(d.getHours())+':'+p2(d.getMinutes())}
function dur(ms){var s=Math.floor(ms/1000);return p2(Math.floor(s/3600))+':'+p2(Math.floor(s%3600/60))+':'+p2(s%60)}
function timeCost(ms,pk){if(ms<1000)return 0;var base=pk?pk.p:0,over=pk?Math.max(0,ms-pk.h*36e5):ms;return base+(over>0?Math.max(5,Math.ceil(over/3600000*S.rate/5)*5):0)}
function extrasSum(s){return (s.extras||[]).reduce(function(a,x){return a+x.p},0)}
function total(s,ms){var t=timeCost(ms,s.pkg),e=extrasSum(s),sub=t+e,d=0;if(s.disc)d=Math.min(sub,s.disc.t==='%'?Math.round(sub*Math.min(s.disc.v,100)/100):s.disc.v);return{time:t,ex:e,disc:d,sum:sub-d}}
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(function(){t.classList.remove('on')},2200)}
function dayLabel(d){var t=ymd(new Date()),n=ymd(new Date(Date.now()+864e5));return d===t?'النهارده':d===n?'بكرة':d}
function bStart(b){return new Date(b.date+'T'+b.time).getTime()}
function bEnd(b){return bStart(b)+b.hours*36e5}
function upcoming(){var n=Date.now();return S.bookings.filter(function(b){return bEnd(b)>n}).sort(function(a,b){return bStart(a)-bStart(b)})}

function renderHero(){
  var h=$('#hero'),n=Date.now(),next=upcoming()[0],mins=next?Math.round((bStart(next)-n)/60000):null;
  var soon=next&&mins<=60&&mins>=-30;
  var specs='<div class="spec">شاشة 75" · PlayStation 5 · تكييف</div>';
  if(S.session){
    h.dataset.s='busy';
    var warn=soon&&mins>=0?'<div class="note">فيه حجز '+esc(next.name)+' الساعة '+next.time+' (بعد '+mins+' دقيقة)</div>':'';
    h.innerHTML='<div class="state"><span class="dot"></span>شغّالة'+(S.session.name?' · '+esc(S.session.name):'')+'</div>'+specs+warn+
      '<div class="timer" id="timer">00:00:00</div><div class="amt" id="amt"></div>'+
      '<div class="spec" style="text-align:center">بدأت '+hm(S.session.start)+(S.session.pkg?' · باقة '+S.session.pkg.h+' ساعة':'')+'</div>'+extrasHtml()+
      '<div class="row"><button class="ghost" id="addItem">+ طلب</button><button class="ghost" id="discBtn">خصم</button><button class="danger" id="stopBtn">إنهاء وحساب</button></div>';
    $('#stopBtn').onclick=openBill;wirePlay();tick();
  }else{
    h.dataset.s=soon?'soon':'free';
    var msg=soon?(mins>0?'محجوزة بعد '+mins+' دقيقة':'محجوزة دلوقتي'):'فاضية';
    var info=soon?'<div class="note">حجز '+esc(next.name)+' من '+next.time+' إلى '+hm(bEnd(next))+'</div>':'';
    h.innerHTML='<div class="state"><span class="dot"></span>'+(soon?'حجز قريب':'متاحة')+'</div>'+specs+info+
      '<div class="free-big">'+msg+'</div><div class="amt">'+S.rate+' ج / الساعة</div>'+pkgSelect()+
      '<div class="row"><input id="pName" placeholder="اسم اللاعب (اختياري)"><button class="primary" id="startBtn">ابدأ اللعب</button></div>';
    $('#startBtn').onclick=function(){startSession($('#pName').value.trim(),null,$('#pkgSel')?+$('#pkgSel').value:-1)};
  }
}
function startSession(name,bid,pi){
  S.session={start:Date.now(),name:name||'',extras:[],pkg:(pi>=0&&S.packages[pi])||null,disc:null};
  if(bid)S.bookings=S.bookings.filter(function(b){return b.id!==bid});
  save();renderAll();toast('بدأ العداد');
}
function tick(){
  $('#clock').textContent=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  if(S.session&&$('#timer')){var ms=Date.now()-S.session.start;$('#timer').textContent=dur(ms);$('#amt').textContent=total(S.session,ms).sum+' ج لحد دلوقتي'}
}
var billEnd=0;
function receipt(s,ms){var t=total(s,ms),ex=s.extras||[];
 var h='<div class="rc"><div class="rh">اللعب</div><div class="rl"><span>المدة '+dur(ms)+(s.pkg?' · باقة '+s.pkg.h+' ساعة':'')+'</span><b>'+t.time+' ج</b></div>';
 if(ex.length)h+='<div class="rh">الطلبات</div>'+ex.map(function(x){return '<div class="rl"><span>'+esc(x.n)+'</span><b>'+x.p+' ج</b></div>'}).join('')+'<div class="rl rs"><span>إجمالي الطلبات</span><b>'+t.ex+' ج</b></div>';
 if(t.disc)h+='<div class="rh">الخصم</div><div class="rl"><span>خصم</span><b>−'+t.disc+' ج</b></div>';
 return h+'</div>'}
function openBill(){
  billEnd=Date.now();var ms=billEnd-S.session.start;
  var t=total(S.session,ms);$('#billAmt').textContent=t.sum+' ج';
  $('#billInfo').innerHTML=receipt(S.session,ms);
  $('#bill').showModal();
}
$('#billPrint').onclick=function(){var ms=billEnd-S.session.start,w=window.open('','_blank');if(!w){toast('اسمح بالنوافذ المنبثقة عشان الطباعة');return}
 w.document.write('<html dir="rtl"><head><meta charset="utf-8"><title>فاتورة</title><style>body{font-family:Tahoma,sans-serif;max-width:300px;margin:auto;padding:10px}h3,.t{text-align:center}.rl{display:flex;justify-content:space-between;padding:3px 0}.rh{font-weight:bold;border-bottom:1px dashed #000;margin-top:10px}.t{font-size:22px;margin-top:12px;font-weight:bold}</style></head><body><h3>Ice N Beans<br>VIP Room</h3><div>'+new Date().toLocaleString('en-GB')+'</div>'+receipt(S.session,ms)+'<div class="t">الإجمالي: '+total(S.session,ms).sum+' ج</div></body></html>');
 w.document.close();w.focus();w.print()};
$('#billBack').onclick=function(){$('#bill').close()};
$('#billOk').onclick=function(){
  var end=billEnd||Date.now(),ms=end-S.session.start;
  S.log.unshift({name:S.session.name,start:S.session.start,end:end,amount:total(S.session,ms).sum,ex:extrasSum(S.session),tm:total(S.session,ms).time,disc:total(S.session,ms).disc});
  S.session=null;save();$('#bill').close();renderAll();toast('اتسجّلت الجلسة');
};

function renderBookings(){
  var l=upcoming(),el=$('#bookings');
  if(!l.length){el.innerHTML='<div class="empty">مفيش حجوزات جاية. ضيف أول حجز من الفورم فوق.</div>';return}
  el.innerHTML=l.map(function(b){
    return '<div class="item"><div><b>'+esc(b.name)+'</b><small>'+dayLabel(b.date)+' · '+b.time+' إلى '+hm(bEnd(b))+(b.phone?' · '+esc(b.phone):'')+'</small></div>'+
    '<div class="acts"><button class="primary" data-go="'+b.id+'">ابدأ</button><button class="ghost" data-del="'+b.id+'">إلغاء</button></div></div>';
  }).join('');
  el.querySelectorAll('[data-go]').forEach(function(x){x.onclick=function(){
    if(S.session){toast('فيه جلسة شغّالة، أنهيها الأول');return}
    var b=S.bookings.find(function(k){return String(k.id)===x.dataset.go});startSession(b.name,b.id)}});
  el.querySelectorAll('[data-del]').forEach(function(x){x.onclick=function(){
    S.bookings=S.bookings.filter(function(k){return String(k.id)!==x.dataset.del});save();renderAll();toast('اتلغى الحجز')}});
}
$('#bkForm').onsubmit=function(e){
  e.preventDefault();
  var b={id:Date.now(),name:$('#bName').value.trim(),date:$('#bDate').value,time:$('#bTime').value,hours:parseFloat($('#bHours').value),phone:$('#bPhone').value.trim()};
  var s=bStart(b),en=bEnd(b);
  if(en<=Date.now()){toast('الوقت ده عدّى');return}
  var clash=S.bookings.find(function(k){return bStart(k)<en&&bEnd(k)>s});
  if(clash){toast('متعارض مع حجز '+clash.name+' الساعة '+clash.time);return}
  S.bookings.push(b);save();e.target.reset();$('#bDate').value=ymd(new Date());$('#bHours').value=1;renderAll();toast('اتحجزت');
};
function renderLog(){
  var t=ymd(new Date()),l=S.log.filter(function(x){return ymd(new Date(x.end))===t});
  var sum=l.reduce(function(a,x){return a+x.amount},0),mins=l.reduce(function(a,x){return a+(x.end-x.start)/6e4},0);
  $('#stats').innerHTML='<div class="stat"><b>'+sum+'</b><small>إيراد النهارده (ج)</small></div><div class="stat"><b>'+l.length+'</b><small>جلسات</small></div><div class="stat"><b>'+(mins/60).toFixed(1)+'</b><small>ساعات لعب</small></div>';
  $('#log').innerHTML=l.length?l.map(function(x){
    return '<div class="item"><div><b>'+(x.name?esc(x.name):'لاعب')+'</b><small>'+hm(x.start)+' إلى '+hm(x.end)+' · '+Math.round((x.end-x.start)/6e4)+' دقيقة'+(x.tm!=null?' · لعب '+x.tm+' ج':'')+(x.ex?' · طلبات '+x.ex+' ج':'')+'</small></div><div class="amount">'+x.amount+' ج</div></div>';
  }).join(''):'<div class="empty">لسه مفيش جلسات النهارده.</div>';
}
function pkgSelect(){if(!S.packages.length)return '';return '<select id="pkgSel" aria-label="الباقة"><option value="-1">بالساعة (من غير باقة)</option>'+S.packages.map(function(k,i){return '<option value="'+i+'">باقة '+k.h+' ساعة · '+k.p+' ج</option>'}).join('')+'</select>'}
function extrasHtml(){var e=S.session.extras||[],d=S.session.disc;if(!e.length&&!d)return '';return '<div class="chips">'+e.map(function(x,i){return '<button class="chip" data-rm="'+i+'">'+esc(x.n)+' · '+x.p+' ج ✕</button>'}).join('')+(d?'<button class="chip" data-rmd="1">خصم '+d.v+(d.t==='%'?'%':' ج')+' ✕</button>':'')+'</div>'}
function wirePlay(){
 $('#addItem').onclick=function(){$('#iName').value='';$('#iPrice').value='';$('#itemDlg').showModal()};
 $('#discBtn').onclick=function(){$('#dVal').value=S.session.disc?S.session.disc.v:'';$('#discDlg').showModal()};
 document.querySelectorAll('[data-rm]').forEach(function(b){b.onclick=function(){S.session.extras.splice(+b.dataset.rm,1);save();renderHero()}});
 var r=document.querySelector('[data-rmd]');if(r)r.onclick=function(){S.session.disc=null;save();renderHero()};
}
$('#itemNo').onclick=function(){$('#itemDlg').close()};
$('#itemOk').onclick=function(){var n=$('#iName').value.trim(),p=parseFloat($('#iPrice').value);if(!n||!(p>=0)){toast('اكتب اسم الطلب وسعره');return}S.session.extras=S.session.extras||[];S.session.extras.push({n:n,p:p});save();$('#itemDlg').close();renderHero();toast('اتضاف الطلب')};
$('#discNo').onclick=function(){$('#discDlg').close()};
$('#discOk').onclick=function(){var v=parseFloat($('#dVal').value);S.session.disc=v>0?{v:v,t:$('#dType').value}:null;save();$('#discDlg').close();renderHero()};
function renderPkgs(){
 $('#pkgList').innerHTML=S.packages.length?S.packages.map(function(k,i){return '<div class="item"><div>'+k.h+' ساعة<small>'+k.p+' ج</small></div><button class="ghost" data-pd="'+i+'">حذف</button></div>'}).join(''):'<div class="empty">مفيش باقات. ضيف أول باقة من تحت.</div>';
 document.querySelectorAll('[data-pd]').forEach(function(b){b.onclick=function(){S.packages.splice(+b.dataset.pd,1);save();renderPkgs();renderAll()}});
}
$('#pkgBtn').onclick=function(){renderPkgs();$('#pkgDlg').showModal()};
$('#pkgClose').onclick=function(){$('#pkgDlg').close()};
$('#pkgAdd').onclick=function(){var h=parseFloat($('#pH').value),p=parseFloat($('#pP').value);if(!(h>0)||!(p>=0)){toast('اكتب الساعات والسعر');return}S.packages.push({h:h,p:p});save();$('#pH').value='';$('#pP').value='';renderPkgs();renderAll()};
function renderAll(){renderHero();renderBookings();renderLog();}
$('#rate').value=S.rate;
$('#rate').onchange=function(){var v=parseFloat(this.value);if(v>=0){S.rate=v;save();renderAll()}};
$('#bDate').value=ymd(new Date());
renderAll();
var c=0;
setInterval(function(){tick();if(++c%30===0&&!(document.activeElement&&document.activeElement.tagName==='INPUT'))renderAll()},1000);
</script>
<script>
/* ===== ربط الأجهزة (Firebase) ===== */
var DB=''; /* بيتوصّل تلقائي بمشروع vip-room-cc751 */
(function(){var P='vip-room-cc751-default-rtdb',C=['https://'+P+'.europe-west1.firebasedatabase.app','https://'+P+'.firebaseio.com','https://'+P+'.asia-southeast1.firebasedatabase.app'];
(function f(i){if(i>=C.length)return;fetch(C[i]+'/.json?shallow=true').then(function(r){if(r.ok){DB=C[i];renderOrders();pushRoom();}else f(i+1)},function(){f(i+1)})})(0)})();
var orders={},ac=null,ringT=null;
var _save=save;save=function(){_save();pushRoom()};
function api(path,method,body){return fetch(DB+path+'.json',{method:method||'GET',body:body?JSON.stringify(body):undefined}).then(function(r){return r.json()})}
function pushRoom(){if(!DB)return;var s=S.session;api('/room','PUT',s?{on:true,start:s.start,name:s.name||'',pkgH:s.pkg?s.pkg.h:0}:{on:false}).catch(function(){})}
function beep(){if(!ac)return;var t=ac.currentTime;[880,660,880,660].forEach(function(f,i){var o=ac.createOscillator(),g=ac.createGain(),s=t+i*.22;o.type='square';o.frequency.value=f;g.gain.setValueAtTime(1,s);g.gain.setValueAtTime(0,s+.18);o.connect(g);g.connect(ac.destination);o.start(s);o.stop(s+.2)})}
function ring(on){if(on&&!ringT&&ac){beep();ringT=setInterval(beep,1300)}if(!on&&ringT){clearInterval(ringT);ringT=null}if(on&&navigator.vibrate)navigator.vibrate([400,200,400])}
function wake(){try{navigator.wakeLock.request('screen')}catch(e){}}
function enableSound(){ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume();beep();wake();renderOrders()}
document.addEventListener('visibilitychange',function(){if(ac)ac.resume();if(document.visibilityState==='visible')wake()});
function setSt(k,st,extra){var o=orders[k];if(!o)return;var b={status:st};if(extra)Object.assign(b,extra);Object.assign(o,b);renderOrders();api('/orders/'+k,'PATCH',b).catch(function(){})}
function toBill(k){var o=orders[k];if(!S.session||!o)return;S.session.extras=S.session.extras||[];o.items.forEach(function(i){S.session.extras.push({n:i.q+'× '+i.n,p:i.q*i.p})});setSt(k,o.status,{billed:true});save();renderHero();toast('اتضافت على حساب الروم')}
function renderOrders(){
  var bar=$('#sndBar'),box=$('#orders');
  if(!DB){bar.innerHTML='<div class="note">الربط مش متفعّل. حط رابط Firebase في متغير DB أول السكريبت عشان الطلبات توصل هنا.</div>';box.innerHTML='';return}
  var list=Object.keys(orders).map(function(k){var o=orders[k];o.k=k;return o}).filter(function(o){return o.status!=='done'&&Date.now()-o.t<432e5}).sort(function(a,b){return a.t-b.t});
  var nn=list.filter(function(o){return o.status==='new'}).length;
  bar.innerHTML=ac?'':'<button class="danger" id="sndBtn" style="width:100%;margin-bottom:10px">الصوت مقفول، دوس هنا لتفعيله</button>';
  if(!ac)$('#sndBtn').onclick=enableSound;
  ring(nn>0);
  document.title=(nn?'('+nn+') طلب جديد · ':'')+'VIP Room · Ice N Beans';
  $('#ordersPanel').style.borderColor=nn?'var(--busy)':'var(--line)';
  box.innerHTML=list.length?list.map(function(o){
    var items=o.items.map(function(i){return i.q+'× '+esc(i.n)}).join('، ');
    return '<div class="item"'+(o.status==='new'?' style="border-top-color:var(--busy)"':'')+'><div><b>'+(o.status==='new'?'طلب جديد':'بيتجهز')+' · '+hm(o.t)+'</b><small>'+items+(o.note?' · ملاحظة: '+esc(o.note):'')+'</small><small class="amount">'+o.total+' ج'+(o.billed?' · على حساب الروم':'')+'</small></div><div class="acts">'+
      (o.status==='new'?'<button class="primary" data-k="'+o.k+'" data-st="prep">بدأ التجهيز</button>':'<button class="primary" data-k="'+o.k+'" data-st="done">اتسلّم</button>')+
      (S.session&&!o.billed?'<button class="ghost" data-k="'+o.k+'" data-bill="1">على الحساب</button>':'')+'</div></div>';
  }).join(''):'<div class="empty">مفيش طلبات دلوقتي.</div>';
  box.querySelectorAll('[data-st]').forEach(function(b){b.onclick=function(){setSt(b.dataset.k,b.dataset.st)}});
  box.querySelectorAll('[data-bill]').forEach(function(b){b.onclick=function(){toBill(b.dataset.k)}});
}
setInterval(function(){if(!DB)return;api('/orders').then(function(o){orders=o||{};renderOrders()}).catch(function(){})},3000);
renderOrders();pushRoom();
</script>
</body>
</html>
